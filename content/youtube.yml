# =====================================================================
# YouTube 影片設定（2026-11-18 建立）
# 網站只放下面這幾個「播放清單」的最新影片，其餘影片一律連到 YouTube 頻道。
# 每天 02:00 由 scripts/fetch_youtube.py 讀這個檔，抓各播放清單最新影片
# → 寫進 data/videos.json（不用 API 金鑰，用 YouTube 公開的播放清單 RSS）。
#
# 要加／減／換順序：改下面 playlists 清單就好（後台 PagesCMS「YouTube 影片（設定）」也能改）。
#   id    ＝播放清單網址 list= 後面那一串（例：https://www.youtube.com/playlist?list=PLTjEk5yqNjac）
#   key   ＝英文代號，網站程式用它決定哪個清單放在哪一頁（不要隨便改；新清單取一個沒用過的英文字）
#   title ＝網站上顯示的名稱
#   intro ＝一句介紹
# =====================================================================

