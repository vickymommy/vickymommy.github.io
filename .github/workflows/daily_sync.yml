name: 每日自動同步（方格子 ＋ YouTube 播放清單）

# ── 觸發時機 ──────────────────────────────────────────────────────────────────
on:
  # 每天台灣時間 02:00 自動執行（UTC 18:00 = 台灣 02:00 次日）
  schedule:
    - cron: '0 18 * * *'

  # 也可在 GitHub Actions 頁面手動點「Run workflow」測試
  workflow_dispatch:

# ── 工作 ──────────────────────────────────────────────────────────────────────
jobs:
  sync:
    name: 同步方格子文章 ＋ 抓 YouTube 播放清單
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要寫入權限才能 push 新檔案
      issues: write      # 2026-09-17 新增：失敗時要能自動建立提醒 Issue

    steps:
      # 1. 取得最新倉庫
      - name: Checkout 倉庫
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 確保取得完整歷史（偵測修改需要）
          fetch-depth: 1

      # 2. 設定 Python
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安裝套件（含 beautifulsoup4 用於頁面解析、pillow 用於圖片還原原圖＋壓縮）
      - name: 安裝相依套件
        run: |
          pip install requests beautifulsoup4 pyyaml lxml pillow

      # 4. 執行 Vocus RSS 同步（新文章 + 修改偵測）
      - name: 同步 Vocus 文章
        run: python scripts/sync_vocus.py

      # 5.（2026-11-18 移除「分享天地／每週精選候選」：玲玲沒時間審，備份在 Justin 本機專案 99.封存/分享天地_20261118/）

      # 6. 抓 content/youtube.yml 列的 YouTube 播放清單最新影片 → data/videos.json
      #    （2026-11-18 改版：只放指定的 AI 播放清單；抓失敗會保留舊資料，最後一步開 Issue 通知）
      - name: 抓取 YouTube 播放清單
        run: python scripts/fetch_youtube.py

      # 7. 重建 data/*.json（articles + community + course）
      - name: 重建 data JSON
        run: python scripts/build.py

      # 8. 提交並推送（若有任何異動）
      - name: 提交並推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/articles/ assets/images/ data/
          git diff --staged --quiet || git commit -m "auto: 每日同步 Vocus + YouTube 影片 [skip ci]"
          git push

      # 8b. 2026-11-18 新增：YouTube 有播放清單抓不到（網站已保留舊影片，不會空白）→ 開 Issue 通知
      - name: YouTube 抓取有問題時開 Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERR=$(python -c "import json;print(chr(10).join(json.load(open('data/videos.json',encoding='utf-8')).get('errors',[])))")
          if [ -n "$ERR" ]; then
            gh issue create --repo "${{ github.repository }}"               --title "⚠️ YouTube 播放清單抓取有問題（$(date -u +%Y-%m-%d)）"               --body "網站已保留上次的影片，不會變空白。問題如下：

          $ERR

          常見原因：播放清單被改成私人、刪除，或 content/youtube.yml 的 ID 打錯。執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      # 9. 2026-09-17 新增：任何前面的步驟失敗，就自動建立一個 GitHub Issue 通知
      #    （不需要額外設定密鑰，用 GitHub Actions 內建的 token 即可）
      - name: 失敗時建立通知 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ 每日自動同步失敗（$(date -u +%Y-%m-%d)）" \
            --body "daily_sync 這次自動執行失敗了，網站可能沒有同步到最新的方格子文章或 YouTube 影片。

          請到這裡查看詳細錯誤原因：
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          不用緊張：現有文章和網站內容不受影響，只是這次「自動更新」暫停了一次。查完錯誤原因後，可以手動關閉這個 Issue。"
      # 2026-11-18 修正：上面 --body 的每一行都必須跟 run: 的內容一樣縮排，
      # 9/17 版有幾行頂格寫，整個 workflow 讀不進去，從 9/17 到 11/18 都沒有執行。
