name: 內容變動時重建 JSON

# ── 觸發時機 ──────────────────────────────────────────────────────────────────
# 1. PagesCMS 存檔後推到 content/ → 自動觸發
# 2. 手動在 GitHub Actions 頁面點「Run workflow」也可觸發
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch:

# ── 避免重複執行（同時有多個 push 時只跑最新的）───────────────────────────────
concurrency:
  group: build-on-push
  cancel-in-progress: true

jobs:
  build:
    name: 重建 data JSON
    runs-on: ubuntu-latest
    # 跳過 github-actions[bot] 的自動推送（避免無限循環）
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      issues: write   # 2026-09-17 新增：失敗時要能自動建立提醒 Issue

    steps:
      - name: Checkout 倉庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: pip install pyyaml requests

      # 2026-11-18：後台改了 content/youtube.yml（播放清單）時，馬上重抓影片，不用等隔天 02:00
      - name: 重抓 YouTube 播放清單
        run: python scripts/fetch_youtube.py

      - name: 重建 data JSON
        run: python scripts/build.py

      - name: 提交並推送（若有異動）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 重建 data JSON [skip ci]"
          # 2026-11-18：另一個 workflow（或玲玲在後台存檔）可能剛好也推了 → 先拉最新再推，最多試 3 次
          #   -X theirs＝衝突時用這次重新產生的版本（data/*.json 都是程式產生的）
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "推送第 $i 次失敗，5 秒後重試"; sleep 5
          done
          exit 1

      # 2026-09-17 新增：失敗時自動建立通知 Issue（例如玲玲在 PagesCMS 存檔的內容格式有誤，導致重建失敗）
      - name: 失敗時建立通知 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ 內容重建失敗（$(date -u +%Y-%m-%d)）" \
            --body "剛剛在 PagesCMS 存檔後，網站自動重建內容失敗了，可能是某篇文章或設定的格式有問題。

          請到這裡查看詳細錯誤原因：
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          網站目前顯示的內容不受影響，只是剛剛那次修改還沒有更新上去。查完錯誤原因後，可以手動關閉這個 Issue。"
      # 2026-11-18 修正：上面 --body 的每一行都必須跟 run: 的內容一樣縮排，
      # 9/17 版有幾行頂格寫，整個 workflow 讀不進去，從 9/17 到 11/18 都沒有執行。
